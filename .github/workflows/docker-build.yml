name: Docker Build & Push

on:
  push:
    branches:
      - master
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      push_image:
        description: "Push images to GHCR after building"
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io

jobs:
  # ── Job 1: smoke-test the main API image on every PR ──────────────────────
  smoke-test:
    name: Smoke-test aml-api
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfiles/Dockerfile
          push: false
          load: true
          tags: aml-api:ci
          cache-from: type=gha,scope=aml-api
          cache-to: type=gha,mode=max,scope=aml-api
          provenance: false

      - name: Health endpoint smoke-test
        run: |
          docker run --rm -d -p 8000:8000 --name aml-ci aml-api:ci
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health; then
              echo "Server ready"
              break
            fi
            echo "Waiting... ($i/15)"
            sleep 2
          done
          docker stop aml-ci

  # ── Job 2: build all images and push to GHCR ──────────────────────────────
  build-push:
    name: Build & push ${{ matrix.image }}
    needs: smoke-test
    runs-on: ubuntu-latest
    # Push on: master branch, version tags, or manual dispatch with push_image=true
    # Build-only on: pull_request
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: aml-api
            dockerfile: dockerfiles/Dockerfile
            description: "Multimodal AML inference API (FastAPI + uvicorn, port 8000)"
          - image: aml-graphsage
            dockerfile: dockerfiles/Dockerfile.graphsage
            description: "GraphSAGE training image (PyTorch + PyG, CPU)"
          - image: aml-hf
            dockerfile: dockerfiles/Dockerfile.hf
            description: "AML API for HuggingFace Spaces (port 7860)"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          labels: |
            org.opencontainers.image.description=${{ matrix.description }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: >-
            ${{
              github.event_name != 'pull_request' &&
              (github.event_name != 'workflow_dispatch' || inputs.push_image == true)
            }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: false

      - name: Write job summary
        if: github.event_name != 'pull_request'
        run: |
          echo "### ${{ matrix.image }} pushed to GHCR" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Registry | \`${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Ref | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Tags | $(echo '${{ steps.meta.outputs.tags }}' | tr '\n' ' ') |" >> $GITHUB_STEP_SUMMARY
