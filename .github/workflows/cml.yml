name: CML — Model Report

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  cml-report:
    name: Generate & Post Model Report
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            matplotlib \
            numpy \
            pandas \
            scikit-learn \
            "mlflow>=2.16.0"
          pip install -e . --no-deps

      - name: Generate comparison plots and report
        run: python scripts/cml_report.py

      # Upload charts so the markdown image links resolve in the PR comment
      - name: Upload report figures
        uses: actions/upload-artifact@v4
        with:
          name: cml-figures
          path: reports/figures/
          retention-days: 30

      - name: Setup CML Environment
        uses: iterative-actions/setup-cml@v1

      - name: Post CML report as PR comment
        run: |
          cml comment create reports/cml_report.md
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
