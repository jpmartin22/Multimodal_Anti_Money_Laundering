name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements_dev.txt ]; then pip install -r requirements_dev.txt; fi
          pip install \
            "fastapi>=0.111.0" \
            "uvicorn>=0.30.0" \
            "pydantic>=2.0" \
            "httpx>=0.27.0" \
            "prometheus-client>=0.20.0" \
            "scikit-learn>=1.5.0" \
            "numpy>=1.26.0" \
            "pandas>=2.2.0" \
            "joblib>=1.4.0" \
            "mlflow>=2.16.0" \
            "omegaconf>=2.3.0" \
            "hydra-core>=1.3.0" \
            "great-expectations>=1.0.0"
          pip install -e . --no-deps

      - name: Lint with ruff
        run: ruff check .

      - name: Format check with ruff
        run: ruff format --check .

      - name: Type check with mypy
        run: mypy src/multimodal_anti_money_laundering --ignore-missing-imports --no-error-summary
        continue-on-error: true

      - name: Run tests with pytest
        run: pytest tests/ --cov=multimodal_anti_money_laundering --cov-report=xml -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Run AUC-PR Evaluation Gate
        run: |
          python -m multimodal_anti_money_laundering.evaluation.eval_gate --metrics reports/metrics.json
        continue-on-error: true

      - name: Run MLflow Model Registry Promotion
        continue-on-error: true
        run: |
          python -m multimodal_anti_money_laundering.models.register_model

      - name: Great Expectations Pre-Training Data Gate Check
        run: |
          python -m multimodal_anti_money_laundering.evaluation.data_gate