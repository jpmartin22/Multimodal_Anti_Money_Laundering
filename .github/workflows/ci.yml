name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          # Dev tools
          pip install -r requirements_dev.txt
          # Slim runtime — only what tests actually import (no torch/transformers/dvc)
          pip install \
            "fastapi>=0.111.0" \
            "uvicorn>=0.30.0" \
            "pydantic>=2.0" \
            "httpx>=0.27.0" \
            "prometheus-client>=0.20.0" \
            "scikit-learn>=1.5.0" \
            "numpy>=1.26.0" \
            "pandas>=2.2.0" \
            "joblib>=1.4.0" \
            "mlflow>=2.16.0" \
            "omegaconf>=2.3.0" \
            "hydra-core>=1.3.0"
          # Install project package without pulling heavy deps (torch etc.)
          pip install -e . --no-deps

      - name: Lint with ruff
        run: ruff check .

      - name: Format check with ruff
        run: ruff format --check .

      - name: Run tests with pytest
        run: pytest tests/ --cov=multimodal_anti_money_laundering --cov-report=xml -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Run AUC-PR Evaluation Gate
        run: |
          python -m multimodal_anti_money_laundering.evaluation.eval_gate --metrics reports/metrics.json

      - name: Data pipeline smoke test
        continue-on-error: true
        run: |
          # Skipped in CI — raw data not available in runner environment
          echo "Data pipeline requires DVC-tracked raw data; run locally with: make data && make train"

      - name: Run MLflow Model Registry Promotion
        continue-on-error: true
        run: |
          python -m multimodal_anti_money_laundering.models.register_model
