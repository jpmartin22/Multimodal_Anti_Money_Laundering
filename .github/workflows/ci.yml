name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test matrix
    runs-on: ubuntu-latest
    env:
      COVERAGE_FAIL: 80
    strategy:
      matrix:
        python-version: [3.9, 3.10, 3.11]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements_dev.txt ]; then pip install -r requirements_dev.txt; fi

      - name: Lint (ruff)
        run: |
          if command -v ruff >/dev/null 2>&1; then ruff check .; else echo "ruff not installed"; fi

      - name: Type check (mypy)
        run: |
          if command -v mypy >/dev/null 2>&1; then mypy . || true; else echo "mypy not installed"; fi

      - name: Run tests with coverage
        run: |
          pytest -q --maxfail=1 --cov=src --cov-report=xml --cov-report=term --cov-fail-under=${{ env.COVERAGE_FAIL }}

      - name: Upload coverage as artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          # Dev tools
          pip install -r requirements_dev.txt
          # Slim runtime — only what tests actually import (no torch/transformers/dvc)
          pip install \
            "fastapi>=0.111.0" \
            "uvicorn>=0.30.0" \
            "pydantic>=2.0" \
            "httpx>=0.27.0" \
            "prometheus-client>=0.20.0" \
            "scikit-learn>=1.5.0" \
            "numpy>=1.26.0" \
            "pandas>=2.2.0" \
            "joblib>=1.4.0" \
            "mlflow>=2.16.0" \
            "omegaconf>=2.3.0" \
            "hydra-core>=1.3.0"
          # Install project package without pulling heavy deps (torch etc.)
          pip install -e . --no-deps

      - name: Lint with ruff
        run: ruff check .

      - name: Format check with ruff
        run: ruff format --check .

      - name: Type check with mypy
        run: mypy src/multimodal_anti_money_laundering --ignore-missing-imports --no-error-summary
        continue-on-error: true

      - name: Run tests with pytest
        run: pytest tests/ --cov=multimodal_anti_money_laundering --cov-report=xml -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Run AUC-PR Evaluation Gate
        run: |
          python -m multimodal_anti_money_laundering.evaluation.eval_gate --metrics reports/metrics.json

      - name: Data pipeline smoke test
        continue-on-error: true
        run: |
          # Skipped in CI — raw data not available in runner environment
          echo "Data pipeline requires DVC-tracked raw data; run locally with: make data && make train"

      - name: Run MLflow Model Registry Promotion
        continue-on-error: true
        run: |
          python -m multimodal_anti_money_laundering.models.register_model
