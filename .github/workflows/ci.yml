name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint and test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_dev.txt
          pip install \
            "fastapi>=0.111.0" \
            "uvicorn>=0.30.0" \
            "pydantic>=2.0" \
            "httpx>=0.27.0" \
            "prometheus-client>=0.20.0" \
            "scikit-learn>=1.5.0" \
            "numpy>=1.26.0" \
            "pandas>=2.2.0" \
            "joblib>=1.4.0" \
            "mlflow>=2.16.0" \
            "omegaconf>=2.3.0" \
            "hydra-core>=1.3.0" \
            "great-expectations>=0.18.0"
          pip install -e . --no-deps

      - name: Lint with ruff
        run: ruff check .

      - name: Format check with ruff
        run: ruff format --check .

      - name: Type check with mypy
        run: mypy src/multimodal_anti_money_laundering --ignore-missing-imports --no-error-summary
        continue-on-error: true

      - name: Run tests with pytest
        run: pytest tests/ --cov=multimodal_anti_money_laundering --cov-report=xml -v

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: coverage.xml

      - name: Run AUC-PR evaluation gate
        run: python -m multimodal_anti_money_laundering.evaluation.eval_gate --metrics reports/metrics.json

      - name: Run data quality gate
        run: python -m multimodal_anti_money_laundering.evaluation.data_gate