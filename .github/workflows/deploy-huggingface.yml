name: Deploy to Hugging Face Spaces

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy-to-hf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

          # Create an orphan branch so HF push has no prior history
          # (HF rejects pushes if any commit in history contains >10MiB files)
          git checkout --orphan hf-deploy
          git reset --hard

          # Remove large files from this branch
          git rm -r --cached reports/drift/ 2>/dev/null || true
          git rm -r --cached data/ 2>/dev/null || true
          git rm -r --cached models/ 2>/dev/null || true
          git rm -r --cached mlruns/ 2>/dev/null || true
          git rm -r --cached checkpoints/ 2>/dev/null || true
          git rm -r --cached logs/ 2>/dev/null || true
          git commit -m "chore: remove large files for HF deployment" --allow-empty

          # Push to HF
          git push https://neha-at:${HF_TOKEN}@huggingface.co/spaces/neha-at/aml-multimodal-scorer hf-deploy:main --force
