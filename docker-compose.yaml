# Load shared environment from .env (copy .env.example → .env to get started)
# Each service can selectively override individual variables inline.

services:

  # ── GraphSAGE training job (Member A) ─────────────────────────────────────
  graphsage-train:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.graphsage
    container_name: aml_graphsage_train
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      - ./mlruns:/app/mlruns
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    profiles:
      - train

  # ── Training job ─────────────────────────────────────────────────────────────
  train:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile
    container_name: aml_train
    command: python -m multimodal_anti_money_laundering.train_model
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./mlruns:/app/mlruns
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1

  # ── Shared MLflow tracking server ───────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: aml_mlflow_postgres
    environment:
      - POSTGRES_USER=${MLFLOW_POSTGRES_USER:-mlflow}
      - POSTGRES_PASSWORD=${MLFLOW_POSTGRES_PASSWORD:-mlflow}
      - POSTGRES_DB=${MLFLOW_POSTGRES_DB:-mlflow}
    volumes:
      - mlflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MLFLOW_POSTGRES_USER:-mlflow} -d ${MLFLOW_POSTGRES_DB:-mlflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile
    container_name: aml_mlflow
    command: >
      sh -c "mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri $$MLFLOW_BACKEND_STORE_URI
      --default-artifact-root $$MLFLOW_DEFAULT_ARTIFACT_ROOT"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - MLFLOW_BACKEND_STORE_URI=postgresql://${MLFLOW_POSTGRES_USER:-mlflow}:${MLFLOW_POSTGRES_PASSWORD:-mlflow}@postgres:5432/${MLFLOW_POSTGRES_DB:-mlflow}
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=${MLFLOW_DEFAULT_ARTIFACT_ROOT:-/app/mlruns}
    volumes:
      - ./mlruns:/app/mlruns
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy


  # ── Inference API ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile
    container_name: aml_api
    command: >
      uvicorn multimodal_anti_money_laundering.serving.api:app
      --host 0.0.0.0 --port 8000
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./mlruns:/app/mlruns
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
    depends_on:
      mlflow:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Debug training service (remote debugpy attach on port 5678) ──────────
  debug-train:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile
    container_name: aml_debug_train
    command: python -m multimodal_anti_money_laundering.train_model
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./mlruns:/app/mlruns
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - AML_DEBUG=1
    ports:
      - "5678:5678"
    profiles:
      - debug
    stdin_open: true
    tty: true

  # ── Prometheus metrics scraper ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: aml_prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      api:
        condition: service_healthy

  # ── Grafana dashboard ──────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: aml_grafana
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    env_file:
      - .env
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-aml_admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  mlflow_postgres_data:
